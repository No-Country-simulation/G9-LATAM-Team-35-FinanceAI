spring.application.name=backend
server.port=8080

# JSON en snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

# Base de datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financeai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.flyway.validate-on-migrate=false
spring.flyway.table=flyway_schema_history

# JPA


spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Seguridad
logging.level.org.springframework.security=DEBUG

# Clave secreta utilizada para firmar los JWT
jwt.secret=EstaEsUnaClaveSecretaDePruebaParaElHackathon

# Duracion del token: 2 horas
jwt.expiration=7200000

python.api.url=http://localhost:8000